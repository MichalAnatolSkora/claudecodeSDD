<style>
  @page {
    size: A4;
    margin: 1.5cm 0.3cm 1.8cm 0.3cm;  /* almost no left/right margin — near full-width text on A4 */
    @bottom-center {
      content: counter(page) " / " counter(pages);
      font-size: 8pt;
      color: #666;
    }
  }
  /* override pandoc's default template: it caps body at max-width:36em centered */
  body { font-size: 9pt; line-height: 1.4; max-width: none !important; margin: 0 !important; padding: 0 !important; }
  h1 { font-size: 15pt; }
  h2 { font-size: 12pt; }
  h3 { font-size: 10.5pt; }
  h4 { font-size: 9.5pt; }
  p, li { font-size: 9pt; }
  pre, code { font-size: 7.5pt; }
  table { font-size: 8pt; }
  blockquote { font-size: 8.5pt; }
</style>
