<style>
  @page {
    size: A4;
    margin: 2cm 2cm 2cm 2cm;
  }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 10pt;
    line-height: 1.45;
    color: #222;
  }
  h1 { font-size: 18pt; margin-top: 1.2em; }
  h2 { font-size: 14pt; margin-top: 1.4em; border-bottom: 1px solid #ccc; padding-bottom: 0.2em; }
  h3 { font-size: 12pt; margin-top: 1.2em; }
  h4 { font-size: 10.5pt; }
  p, li { font-size: 10pt; }
  pre, code {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 8.5pt;
  }
  pre {
    background: #f5f5f5;
    padding: 0.6em 0.8em;
    border-radius: 4px;
    line-height: 1.35;
    page-break-inside: avoid;
  }
  code { background: #f0f0f0; padding: 0 3px; border-radius: 3px; }
  pre code { background: transparent; padding: 0; }
  table { font-size: 9pt; border-collapse: collapse; margin: 0.6em 0; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; }
  th { background: #f0f0f0; }
  blockquote {
    border-left: 3px solid #aaa;
    margin-left: 0;
    padding-left: 0.8em;
    color: #555;
    font-size: 9.5pt;
  }
  a { color: #1a5fb4; text-decoration: none; }
  hr { border: none; border-top: 1px solid #ddd; margin: 1.5em 0; }
  /* table of contents */
  #TOC ul { list-style: none; padding-left: 1em; }
  #TOC > ul { padding-left: 0; }
  #TOC a { color: #222; }
</style>
